[package]
name = "dnscheck"
version = "0.1.0"
edition = "2021"
description = "Queries multiple public DNS-over-HTTPS resolvers at once and diffs the answers — a CLI for what whatsmydns.net does in a browser"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/dnscheck"
readme = "README.md"
keywords = ["dns", "doh", "propagation", "cli", "networking"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "dnscheck"
path = "src/lib.rs"

[[bin]]
name = "dnscheck"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
